[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toc-rag"
version = "0.1.0"
description = "Vectorless RAG: an LLM agent navigates a document's table-of-contents tree."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10",
    "python-dotenv>=1.0",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=1.7",
    "langchain-google-genai>=4.4",
    "langgraph>=0.2",
]

[project.optional-dependencies]
app = ["reflex>=0.7"]
dev = ["pytest>=8", "playwright>=1.45", "reportlab>=4"]

[project.scripts]
tocrag = "toc_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
